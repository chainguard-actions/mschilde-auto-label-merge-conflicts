name: Test basic usage - auto-label merge conflicts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run auto-label merge conflicts action
        id: action
        continue-on-error: true
        uses: .
        with:
          CONFLICT_LABEL_NAME: conflict
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action was invoked with required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action requires a real GitHub token and repo context to label PRs.
          # We verify it was invoked (outcome is success or failure, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with CONFLICT_LABEL_NAME=conflict and GITHUB_TOKEN provided"
